<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cut Log</title>
<meta name="theme-color" content="#2C55D6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cut Log">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <header class="top">
    <h1>Cut Log</h1>
    <div class="daynav">
      <button class="icon" id="prev" aria-label="Previous day">‹</button>
      <span id="dayLabel">Today</span>
      <button class="icon" id="next" aria-label="Next day">›</button>
    </div>
  </header>

  <section class="panel">
    <h2>Day total</h2>
    <div class="totals">
      <div class="metric">
        <span class="label">Calories</span>
        <span class="big num" id="calNum">0</span>
        <div class="bar"><i id="calBar"></i><b id="calLo"></b><b id="calHi"></b></div>
        <span class="sub" id="calSub"></span>
      </div>
      <div class="metric p">
        <span class="label">Protein</span>
        <span class="big num" id="proNum">0<small>g</small></span>
        <div class="bar"><i id="proBar"></i></div>
        <span class="sub" id="proSub"></span>
      </div>
    </div>
    <div class="status" id="status"></div>
  </section>

  <section class="actions">
    <button class="act" data-open="scan"><span class="act-t">Scan barcode</span><span class="act-s">Packaged food</span></button>
    <button class="act" data-open="label"><span class="act-t">Photo of label</span><span class="act-s">Reads the numbers</span></button>
    <button class="act" data-open="search"><span class="act-t">Search foods</span><span class="act-s">Eggs, potatoes, chicken…</span></button>
    <button class="act" data-open="meals"><span class="act-t">My meals</span><span class="act-s">One tap</span></button>
  </section>

  <section class="panel">
    <h2>Eaten</h2>
    <div class="rows" id="rows"></div>
  </section>

  <section class="panel">
    <h2>Morning weigh-in</h2>
    <div class="wrow">
      <input id="wIn" type="number" inputmode="decimal" step="0.1" min="80" max="500" placeholder="lb, after waking" aria-label="Weight in pounds">
      <button class="btn" id="wSave">Save</button>
    </div>
    <div class="wstats">
      <div><span class="k">7-day avg</span><span class="v" id="avg7">–</span></div>
      <div><span class="k">vs prior 7</span><span class="v" id="delta">–</span></div>
      <div><span class="k" id="goalK">To goal</span><span class="v" id="toGoal">–</span></div>
    </div>
    <div id="chart"></div>
    <span class="hint" id="wHint"></span>
  </section>

  <section class="panel">
    <details>
      <summary>Targets, saved foods and backup</summary>
      <div class="settings">
        <form id="tForm" class="tgrid">
          <label>Calories low<input id="tLo" type="number" inputmode="numeric"></label>
          <label>Calories high<input id="tHi" type="number" inputmode="numeric"></label>
          <label>Protein (g)<input id="tPro" type="number" inputmode="numeric"></label>
          <label>Goal weight (lb)<input id="tGoal" type="number" inputmode="decimal" step="0.1"></label>
          <button class="btn full" type="submit">Save targets</button>
        </form>
        <h3>Saved foods</h3>
        <div id="foodList" class="mlist"></div>
        <h3>Backup</h3>
        <p class="hint">Your data lives only on this phone. Export a backup now and then, and import it if you switch phones.</p>
        <div class="wrow">
          <button class="btn ghost" id="exportBtn">Export backup</button>
          <label class="btn ghost filebtn">Import backup<input id="importIn" type="file" accept="application/json,.json" hidden></label>
        </div>
      </div>
    </details>
  </section>
</main>

<!-- Bottom sheet used by every add flow -->
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet-head">
    <h2 id="sheetTitle">Add food</h2>
    <button class="icon" id="sheetClose" aria-label="Close">×</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<input type="file" id="photoIn" accept="image/*" capture="environment" hidden>

<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js" defer></script>
<script src="foods.js"></script>
<script src="app.js"></script>
</body>
</html>
